<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2140">
<title>Torre Flami</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(120% 80% at 50% 30%, #4a3a78, #2a2140 60%, #1c1630); font-family: Fredoka, system-ui, sans-serif; }
body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.selector { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 0; justify-content: center; flex: none; }
.selector[hidden] { display: none; }
.selector button { background: rgba(26,18,54,.8); color: #d8d0f5; border: 1px solid #4a3d7a; border-radius: 999px; padding: 7px 14px; font: 600 14px Fredoka, sans-serif; white-space: nowrap; }
.selector button.on { background: #ff6fae; color: #1a1236; border-color: #ff6fae; }
.torre { position: relative; flex: 1; min-height: 0; width: 100%; }
.torre canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tc-pista { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); background: rgba(26,18,54,.85); color: #fff; font: 500 14px Fredoka, sans-serif; padding: 8px 14px; border-radius: 16px; max-width: 90%; text-align: center; pointer-events: none; transition: opacity .6s; }
.tc-pista.fuera { opacity: 0; }
.tc-zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
.tc-zoom button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(26,18,54,.9); color: #fff; font: 600 24px Fredoka, system-ui, sans-serif; cursor: pointer; }
.tc-salas { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 6px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; justify-content: safe center; }
.tc-salas::-webkit-scrollbar { display: none; }
.tc-salas button { flex: none; background: rgba(26,18,54,.9); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 14px; font: 600 14px Fredoka, system-ui, sans-serif; cursor: pointer; }
.tc-salas button:active { background: #ff6fae; color: #1a1236; }

</style>
</head>
<body>
<div class="selector" id="selector" hidden></div>
<div class="torre" id="torre"></div>
<script>
let APP = null;
const horas = (s) => (s ? (Date.now() - new Date(s)) / 3600000 : Infinity);
function tablas(a) {
  const c = a.cola || {}, vids = a.videos || [], r = a.redes || {};
  const es = vids.filter((v) => (v.canal || 'es') === 'es');
  const ultPc = c.pc_ultima || a.actualizado;
  const minPc = ultPc ? (Date.now() - new Date(ultPc)) / 60000 : null;
  return {
    totales: [{ vistas: es.reduce((s, v) => s + (v.vistas || 0), 0), likes: es.reduce((s, v) => s + (v.likes || 0), 0), videos: es.length }],
    redes: [
      { red: 'YouTube', seguidores: r.youtube ?? null }, { red: 'TikTok', seguidores: r.tiktok ? r.tiktok.seguidores : null, likes: r.tiktok ? r.tiktok.likes : null },
      { red: 'Instagram', seguidores: r.instagram ? r.instagram.seguidores : null }, { red: 'YouTube Brasil', seguidores: r.youtube_pt ?? null }],
    cola: [{ guiones: c.guiones_pendientes || 0, listos: c.listos_para_subir || 0 }],
    pc: [{ version: c.pc_version || '', ultima_ejecucion: a.actualizado }],
    pc_estado: [{ estado: minPc == null ? 'Sin datos' : minPc <= 45 ? 'Trabajando' : 'Apagado' }],
    agentes: [
      { id: 'guionista', ultima: c.ultima_guion, resultado: !c.ultima_guion || horas(c.ultima_guion) < 26 ? 'ok' : 'falló' },
      { id: 'publicador', ultima: c.ultima_publicacion, resultado: (c.listos_para_subir || 0) === 0 || !c.ultima_publicacion || horas(c.ultima_publicacion) < 13 ? 'ok' : 'falló' },
      { id: 'analista', ultima: c.ultima_estrategia, resultado: 'ok' }],
    videos: vids,
    historico: (a.historico || []).map((h) => ({ hora: h.hora, vistas: h.vistas })),
    pendientes: (c.proximos || []).map((n) => ({ nombre: n })),
    publicados: new Array(c.publicados || 0).fill({})
  };
}
window.dash = { data: (id) => (APP ? { status: 'ok', data: tablas(APP)[id] || [] } : { status: 'loading', data: [] }) };
</script>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="oficina.js"></script>
<script src="oficina3d.js"></script>
<script>
const el = document.getElementById('torre');
const OFI = window.tcOfi3d && window.tcOfi3d.disponible() ? window.tcOfi3d : window.tcOfi;
const st = OFI.mount(el);
let PROYECTO = null;
try { PROYECTO = localStorage.getItem('proyecto'); } catch (e) {}
async function proyectos() {
  try {
    const lista = await (await fetch('data/canales.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (!PROYECTO || !lista.some((p) => p.slug === PROYECTO)) PROYECTO = lista[0] && lista[0].slug;
    const sel = document.getElementById('selector');
    sel.hidden = lista.length < 2;
    sel.replaceChildren(...lista.map((p) => {
      const b = document.createElement('button'); b.textContent = p.nombre; if (p.slug === PROYECTO) b.className = 'on';
      b.onclick = () => { PROYECTO = p.slug; try { localStorage.setItem('proyecto', p.slug); } catch (e) {} proyectos(); cargar(); };
      return b;
    }));
  } catch (e) {}
}
async function cargar() {
  try {
    const r = await fetch('data/' + (PROYECTO || 'app') + '.json?t=' + Date.now(), { cache: 'no-store' });
    APP = await r.json();
    OFI.update(el, st);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
proyectos().then(cargar);
setInterval(cargar, 120000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>

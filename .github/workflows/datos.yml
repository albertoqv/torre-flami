name: Actualizar datos
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/datos.py
      - name: Guardar si ha cambiado
        run: |
          git config user.name "flami-bot"
          git config user.email "flami-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "datos $(date -u +%FT%TZ)" && git push)
